# Daily radar run. Lives at .github/workflows/radar.yml
name: radar
on:
  schedule:
    - cron: "17 9 * * *"   # every day at 09:17 UTC; change the time if you like
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab
permissions:
  contents: write            # lets the run save its results back into the repo
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, then save whatever was collected
        env:
          GITHUB_TOKEN: ${{ github.token }}   # built in; no secret to set up
          PYTHONUTF8: "1"
        run: |
          set +e
          python radar.py collect
          rc=$?
          set -e
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state RADAR.md
          if ! git diff --cached --quiet; then
            git commit -q -m "radar: $(date -u +%F)"
            git pull -q --rebase
            git push -q
          fi
          # if trending or star counts failed, fail the run AFTER saving, so GitHub emails you
          exit $rc
